[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-ev-system"
version = "0.2.0"
description = "Research/paper-tracking +EV sports betting system: NFL/MLB/CFB models priced against sharp and soft books"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Storage, odds ingest, pricing pipeline
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "requests>=2.31",
    "python-dotenv>=1.0",
    # Modeling
    "lightgbm>=4.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "polars>=1.21",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "nflreadpy>=0.1.0",
    # CLI and board UI
    "rich>=13.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "shap>=0.44",
    "streamlit>=1.32",
]
ml = [
    "shap>=0.44",
]
dashboard = [
    "streamlit>=1.32",
]

[project.scripts]
sports-ev = "sports_ev.cli:main"
sports-ev-dashboard = "sports_ev.dashboard.__main__:main"
sports-edge = "nfl_edge.cli:app"
nfl-edge = "nfl_edge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
