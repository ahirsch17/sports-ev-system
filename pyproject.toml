[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-ev-system"
version = "0.1.0"
description = "Research/paper-tracking +EV sports betting system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "lightgbm>=4.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "shap>=0.44",
    "streamlit>=1.32",
]
ml = [
    "shap>=0.44",
]
dashboard = [
    "streamlit>=1.32",
]

[project.scripts]
sports-ev-dashboard = "sports_ev.dashboard.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
