services:
  postgres:
    image: postgres:16-alpine
    container_name: sports-ev-postgres
    environment:
      POSTGRES_USER: sports_ev
      POSTGRES_PASSWORD: sports_ev_dev
      POSTGRES_DB: sports_ev
    ports:
      - "5433:5432"
    volumes:
      - sports_ev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports_ev -d sports_ev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sports_ev_pgdata:
